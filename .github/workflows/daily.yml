name: Daily Calendar Post

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      preview:
        description: 'Set to "true" to force a post now.'
        required: false
        default: 'false'
      offset:
        description: 'Day offset for preview (0=today, 1=tomorrow).'
        required: false
        default: '0'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Run daily post
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          START_DATETIME_UTC: ${{ secrets.START_DATETIME_UTC }}
          # map inputs to env so script can read them
          FORCE_POST: ${{ github.event.inputs.preview }}
          PREVIEW_OFFSET: ${{ github.event.inputs.offset }}
        run: |
          if [ "${{ github.event.inputs.preview }}" = "true" ]; then
            python send_daily.py --preview --offset ${{ github.event.inputs.offset }}
          else
            python send_daily.py
          fi
